<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>portray</title>
    <!-- Where the page gets its model. `cargo portray export` rewrites this to
         graph.json, which is the whole of what makes the viewer static. -->
    <meta name="portray-source" content="api/graph" />
    <link rel="icon" href="favicon.svg" />
    <!--
      Sets [data-theme] and color-scheme before first paint, for an explicit
      choice — a host's ?theme= or a reader's saved preference — that
      disagrees with the operating system. Without this, src/theme.js would
      not run until after the page has already painted once in the system's
      light, and switching color-scheme only once style.css has finished
      loading would still leave a gap, over a real network, where the browser
      paints its default canvas before either can take hold. Keep this
      precedence in sync with theme.js's themeFromHost, loadTheme and
      resolveTheme.
    -->
    <script>
      (function () {
        try {
          var theme = new URLSearchParams(window.location.search).get("theme");
          if (theme !== "light" && theme !== "dark") {
            theme = localStorage.getItem("portray.theme.v1");
          }
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
            // The attribute alone only pays off once style.css parses; until
            // then the browser has nothing telling it which native canvas to
            // paint, and a stylesheet fetched over a real network is not
            // instant. Setting color-scheme inline is what closes that gap.
            document.documentElement.style.colorScheme = theme;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="src/tokens.css" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header id="crate-name">loading…</header>
        <!-- What acts on the view as a whole, above the filters that make it:
             find an artifact, fit or reset, take a copy away. It reads with
             the panels because it is the same errand as the panels — deciding
             what is drawn — and leaves the canvas to the two switches that
             only move what is already there. -->
        <div id="toolbar"></div>
        <div id="panels"></div>
      </aside>
      <!-- The seam the sidebar is widened by; `sidebar.js` gives it meaning. -->
      <div
        id="sidebar-resize"
        role="separator"
        aria-orientation="vertical"
        aria-label="sidebar width"
        tabindex="0"
      ></div>
      <main id="canvas">
        <div id="viewport"></div>
        <!-- The two switches that act on the canvas itself: they float over
             the drawing rather than sitting in a band of their own, which is
             also why the one that hides the panels is still there once it
             has. -->
        <div id="canvas-switches"></div>
        <div id="status"></div>
      </main>
    </div>
    <!-- Plain ES modules, served straight off disk: no bundler, no npm. -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
