[package]
name = "cargo-portray"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
description = "Interactive item-level dependency explorer for Rust crates"
license = "GPL-3.0-or-later"

# Release todo list
# - Implement method-in-struct feature
# - Light/Dark mode
publish = false

readme = "README.md"
repository = "https://github.com/wilversings/cargo-portray"
keywords = ["dependency-graph", "cargo-plugin", "visualization", "call-graph"]
categories = ["development-tools::cargo-plugins", "visualization"]

# assets/, scripts/, AGENTS.md are dev-only; ui/ ships because src/ui.rs
# resolves it at runtime via CARGO_MANIFEST_DIR.
exclude = ["assets/", "scripts/", "AGENTS.md"]

# Deliberately detached from the konductord package above it. This is dev
# tooling: it must not appear in the daemon's Cargo.lock, must not be dragged
# into `cargo clippy --all-targets`, and must not be cross-compiled by the
# musl release build.
[workspace]

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tiny_http = "0.12"
notify = { version = "8", default-features = false }
